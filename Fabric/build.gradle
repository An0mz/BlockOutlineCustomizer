plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

base {
    archivesName = "boc-${minecraft_version}-fabric"
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases' }
}

sourceSets {
    main {
        java {
            srcDirs += ['../Common/src/main/java', '../Common/src/client/java']
        }
        resources {
            srcDirs += ['../Common/src/main/resources']
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings loom.officialMojangMappings()

    // ModMenu config screen integration (compile against the API only)
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    modImplementation "net.fabricmc:fabric-loader:0.18.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.140.2+1.21.11"
}

processResources {
    def props = [
            "version": version,
            "mod_id": mod_id,
            "mod_name": mod_name,
            "mod_description": mod_description
    ]

    inputs.properties(props)

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}