# Publishes the mod to Modrinth, CurseForge, and GitHub Releases.
#
# Setup (one time):
#   1. Create the project on Modrinth and CurseForge.
#   2. Fill in MODRINTH_ID and CURSEFORGE_ID below.
#   3. Add repository secrets (Settings > Secrets and variables > Actions):
#        MODRINTH_TOKEN   - https://modrinth.com/settings/pats (needs "Create versions")
#        CURSEFORGE_TOKEN - https://legacy.curseforge.com/account/api-tokens
#
# To release: push a tag like v1.4.0 (or run this workflow manually).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  MODRINTH_ID: REPLACE_ME        # e.g. AbCdEfGh from your Modrinth project URL
  CURSEFORGE_ID: REPLACE_ME      # numeric project id from CurseForge "About Project"
  MINECRAFT_VERSION: '26.1.2'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Publish Fabric jar
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: Fabric/build/libs/!(*-sources).jar
          loaders: fabric
          game-versions: ${{ env.MINECRAFT_VERSION }}
          name: Block Outline Customizer ${{ github.ref_name }} (Fabric)

      - name: Publish NeoForge jar
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: NeoForge/build/libs/!(*-sources).jar
          loaders: neoforge
          game-versions: ${{ env.MINECRAFT_VERSION }}
          name: Block Outline Customizer ${{ github.ref_name }} (NeoForge)
